<main class="access"><a class="brand" routerLink="/">⚽ GolLiga</a><section class="login"><span class="lock" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg></span><h1>Acceso de administración</h1><p>Ingresa con las credenciales asignadas. Tu perfil determina los módulos disponibles.</p><form (ngSubmit)="submit()" #loginForm="ngForm"><label for="admin-email">Correo electrónico</label><input id="admin-email" name="email" type="email" autocomplete="username" [(ngModel)]="email" required email placeholder="nombre@organización.com"><label for="admin-password">Contraseña</label><input id="admin-password" name="password" type="password" autocomplete="current-password" [(ngModel)]="password" required placeholder="Ingresa tu contraseña"><p class="error" role="alert">{{ error }}</p><button type="submit" [disabled]="loginForm.invalid || submitting">{{ submitting ? 'Validando…' : 'Continuar' }} <span>→</span></button></form><a class="back" routerLink="/">← Volver a los torneos</a></section></main>
