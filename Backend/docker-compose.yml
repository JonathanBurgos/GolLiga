services:
  postgres:
    image: postgres:17-alpine
    container_name: golliga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: golliga
      POSTGRES_USER: golliga
      POSTGRES_PASSWORD: golliga_dev
    ports:
      - '5432:5432'
    volumes:
      - golliga_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U golliga -d golliga']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  golliga_postgres:
